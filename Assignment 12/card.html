<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Component</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            padding: 40px;
        }
        .card {
            border: 1px solid #cbd5e1;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background-color: #ffffff;
            max-width: 320px;
        }
        .card h2 {
            margin-top: 0;
            color: #1e293b;
        }
        .card p {
            color: #475569;
            line-height: 1.5;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Web Development Fundamentals</h2>
        <p>This introductory module provides essential skills for creating structured and styled websites. Students learn to implement responsive layouts and clean modern components.</p>
    </div>
</body>
